name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "index.html"
      - "first_draft.html"
      - "dev.html"
      - "checkin.html"
      - "CNAME"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare static site bundle (only public HTML pages and CNAME)
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp first_draft.html _site/first_draft.html
          cp dev.html _site/dev.html
          cp checkin.html _site/checkin.html
          echo "gdgcloudbkk.space" > _site/CNAME
          touch _site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
